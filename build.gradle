plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'net.neoforged.gradle.userdev' version '7.0.+' apply false
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.18' apply false
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    def isNeoForge1211 = project.path == ':modules:neoforge:1.21.1'
    def isFabric1211 = project.path == ':modules:fabric:1.21.1'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of((isNeoForge1211 || isFabric1211) ? 21 : 17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (isNeoForge1211 || isFabric1211) ? 21 : 17
    }
}