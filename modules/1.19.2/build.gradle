task publishModdedSite {
    group = 'publishing'
    description = "Publish ${mod_name} ${minecraft_version} to Modrinth and CurseForge"
    dependsOn 'build', 'publishCurseForge', 'modrinth'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            artifact jar
            fg.component(it)
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.getRelease().set(17)
}