import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

def changelogText = project.file('changelog.md').exists()
        ? project.file('changelog.md').text
        : "No changelog available"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}



repositories {
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.skynetcloud.ca/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    compileOnly "curse.maven:sophisticated-backpacks-422301:8231066"
    runtimeOnly "curse.maven:sophisticated-backpacks-422301:8231066"

    compileOnly "curse.maven:sophisticated-core-618298:8231043"
    runtimeOnly "curse.maven:sophisticated-core-618298:8231043"

    compileOnly "curse.maven:travelers-backpack-321117:8120689"
    runtimeOnly "curse.maven:travelers-backpack-321117:8120689"

    compileOnly "curse.maven:backpacked-352835:7866688"
    runtimeOnly "curse.maven:backpacked-352835:7866688"

    compileOnly "curse.maven:framework-549225:7530361"
    runtimeOnly "curse.maven:framework-549225:7530361"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pack_version           : pack_version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn jar

    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload('1288945', file("build/libs/${mod_name}-neoforge-${minecraft_version}-${mod_version}.jar"))
    mainFile.displayName = "${mod_name}-${mod_version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = changelogText
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addGameVersion("NeoForge")
    mainFile.addGameVersion("Client")
    mainFile.addGameVersion("Server")

    mainFile.addOptional("sophisticated-backpacks")
    mainFile.addOptional("travelers-backpack")
    mainFile.addOptional("curios")
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "ezweight"
    versionName = "${mod_name}-${mod_version}-${minecraft_version}"
    versionNumber = "${mod_name}-${mod_version}-${minecraft_version}"
    versionType = "release"
    uploadFile = file("build/libs/${mod_name}-neoforge-${minecraft_version}-${mod_version}.jar")
    gameVersions = ["${minecraft_version}"] as Iterable<? extends String>
    loaders = ["neoforge"]
    changelog = changelogText

    dependencies {
        optional.project 'sophisticated-backpacks'
        optional.project 'travelersbackpack'
        optional.project 'curios'
    }
}

task publishModdedSite {
    group = 'publishing'
    dependsOn 'build', 'publishCurseForge', 'modrinth'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

configurations.configureEach {
    resolutionStrategy {
        force "org.ow2.asm:asm:9.8"
        force "org.ow2.asm:asm-tree:9.8"
        force "org.ow2.asm:asm-commons:9.8"
        force "org.ow2.asm:asm-util:9.8"
        force "org.ow2.asm:asm-analysis:9.8"
    }
}